name: Daily MD Lottery ROI Scraper

on:
  schedule:
    # Runs every day at 06:00 UTC (2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run ROI Scraper
        run: python scraper.py

      - name: Commit and push updated ROI data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scratch_offs_roi.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scratch-off ROI data [skip ci]" && git push)
